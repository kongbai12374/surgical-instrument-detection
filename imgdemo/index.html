<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手术器械检测演示</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --text:#1a2230; --muted:#6b7686;
    --line:#dde3ec; --accent:#2f6feb; --accent-soft:#eaf1fe; --ok:#12a150; --warn:#c2410c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center; align-items:flex-start;
    padding:5vh 16px 48px; line-height:1.5;
  }
  .wrap{width:100%; max-width:680px}
  header{margin-bottom:18px}
  h1{margin:0 0 6px; font-size:24px; letter-spacing:.2px}
  .sub{margin:0; color:var(--muted); font-size:14px}
  .classes{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap}
  .chip{font-size:12px; padding:3px 9px; border-radius:999px; background:#eef2f9; color:#41506a; display:inline-flex; align-items:center; gap:5px}
  .chip i{width:7px; height:7px; border-radius:50%; display:inline-block}
  .card{background:var(--card); border-radius:16px; padding:20px; box-shadow:0 1px 2px rgba(20,30,50,.05), 0 8px 28px rgba(20,30,50,.06)}
  .drop{
    display:block; border:2px dashed var(--line); border-radius:12px; padding:28px 18px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s; background:#fbfcfe;
  }
  .drop:hover{border-color:#b9c6db}
  .drop.over{border-color:var(--accent); background:var(--accent-soft)}
  .drop svg{display:block; margin:0 auto 10px; color:#9aa7ba}
  .drop .t{font-size:15px; font-weight:600}
  .drop .h{font-size:13px; color:var(--muted); margin-top:4px}
  input[type=file]{display:none}
  .stage{margin-top:16px; display:none; position:relative; border-radius:10px; overflow:hidden; background:#0f1622}
  .stage img{width:100%; display:block}
  .stage canvas{position:absolute; left:0; top:0; width:100%; height:100%}
  .meta{margin-top:10px; font-size:13px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap}
  .row{display:flex; gap:10px; margin-top:16px}
  button{font:inherit; cursor:pointer; border-radius:10px; border:1px solid transparent; padding:11px 20px; transition:.15s}
  button:disabled{cursor:not-allowed; opacity:.5}
  .primary{background:var(--accent); color:#fff; font-weight:600; flex:1}
  .primary:not(:disabled):hover{background:#2560d4}
  .ghost{background:#fff; border-color:var(--line); color:var(--muted)}
  .ghost:hover{background:#f6f8fb}
  .samples{margin-top:14px; font-size:13px; color:var(--muted); display:none}
  .samples .thumbs{display:flex; gap:10px; margin-top:8px; flex-wrap:wrap}
  .samples figure{margin:0; width:88px; text-align:center}
  .samples img{width:88px; height:66px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:pointer; transition:.15s; display:block}
  .samples img:hover{border-color:var(--accent); transform:translateY(-1px)}
  .samples figcaption{font-size:11px; color:#8b97aa; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .err{margin-top:14px; padding:11px 14px; border-radius:10px; background:#fff1f0; color:#b42318; font-size:14px; display:none}
  .result{margin-top:22px; padding-top:18px; border-top:1px solid var(--line); display:none}
  .summary{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .summary .big{font-size:20px; font-weight:700}
  .summary .counts{font-size:13px; color:var(--muted)}
  .dets{margin-top:14px; display:flex; flex-direction:column; gap:8px}
  .det{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:9px}
  .det .dot{width:9px; height:9px; border-radius:2px}
  .det .nm{font-weight:600}
  .det .cf{color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px}
  .empty{margin-top:14px; padding:12px 14px; border-radius:10px; background:#fff8eb; color:var(--warn); font-size:14px}
  .foot{margin-top:14px; font-size:12px; color:#94a0b2; text-align:center; line-height:1.7}
  .spinner{width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; display:inline-block; vertical-align:-2px; margin-right:8px; animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:520px){ .samples img{width:72px; height:54px} .samples figure{width:72px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>手术器械检测</h1>
    <p class="sub">上传一张器械照片，模型框出每件器械的位置并给出类别。</p>
    <div class="classes" id="classes"></div>
  </header>

  <div class="card">
    <label class="drop" id="drop" for="file">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-4.5-4.5L9 18"/>
      </svg>
      <div class="t">拖拽图片到这里，或点击选择</div>
      <div class="h">支持 JPG / PNG / WebP，最大 25 MB，也可直接 Ctrl+V 粘贴</div>
    </label>
    <input type="file" id="file" accept="image/*">

    <div class="stage" id="stage">
      <img id="thumb" alt="待检测图片">
      <canvas id="cv"></canvas>
    </div>
    <div class="meta" id="meta" style="display:none">
      <span id="fname"></span><span id="fsize"></span><span id="fdim"></span>
    </div>

    <div class="samples" id="samples">
      <span>没有合适的图片？点示例：</span>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="row">
      <button class="primary" id="go" disabled>开始检测</button>
      <button class="ghost" id="reset" style="display:none">清空</button>
    </div>

    <div class="err" id="err"></div>

    <div class="result" id="result">
      <div class="summary">
        <span class="big" id="sumMain"></span>
        <span class="counts" id="sumCounts"></span>
      </div>
      <div class="dets" id="dets"></div>
      <div class="empty" id="empty" style="display:none">图中没有检测到器械。可以换一张更清晰、器械更完整的照片。</div>
    </div>
  </div>
  <div class="foot" id="foot">模型加载中…</div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const drop = $('drop'), fileInput = $('file'), go = $('go'), reset = $('reset');
  const stage = $('stage'), thumb = $('thumb'), cv = $('cv'), meta = $('meta');
  const errBox = $('err'), result = $('result');
  const PALETTE = ['#2f6feb', '#12a150', '#e0670c', '#b4318f', '#0d9488', '#7c3aed'];
  let current = null, busy = false, objectUrl = null, lastDets = [];

  const SAMPLES = [
    { name: 'scalpel.jpg', cap: '手术刀', url: 'samples/scalpel.jpg' },
    { name: 'clamp.jpg', cap: '分离钳', url: 'samples/clamp.jpg' },
    { name: 'curved.jpg', cap: '弯梅奥剪', url: 'samples/curved.jpg' },
    { name: 'multi.jpg', cap: '四件同框', url: 'samples/multi.jpg' }
  ];

  const colorOf = (cls) => PALETTE[(cls || 0) % PALETTE.length];

  function showError(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
  function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }

  function clearBoxes() {
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    lastDets = [];
  }

  function resetAll() {
    current = null; lastDets = [];
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    thumb.removeAttribute('src');
    stage.style.display = 'none';
    meta.style.display = 'none';
    result.style.display = 'none';
    $('dets').innerHTML = '';
    reset.style.display = 'none';
    go.disabled = true; go.textContent = '开始检测';
    fileInput.value = '';
    clearError();
    clearBoxes();
  }

  function pick(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) return showError('请选择图片文件');
    clearError();
    current = file;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    thumb.src = objectUrl;
    stage.style.display = 'block';
    meta.style.display = 'flex';
    $('fname').textContent = file.name || '剪贴板图片';
    $('fsize').textContent = (file.size / 1024).toFixed(0) + ' KB';
    $('fdim').textContent = '';
    result.style.display = 'none';
    reset.style.display = 'inline-block';
    go.disabled = false;
    clearBoxes();
  }

  function drawBoxes(dets) {
    if (!thumb.naturalWidth) return;
    const rect = thumb.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(rect.width * dpr);
    cv.height = Math.round(rect.height * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, rect.width, rect.height);
    const sx = rect.width / thumb.naturalWidth, sy = rect.height / thumb.naturalHeight;

    dets.forEach((d) => {
      const [x1, y1, x2, y2] = d.box;
      const x = x1 * sx, y = y1 * sy, w = (x2 - x1) * sx, h = (y2 - y1) * sy;
      const c = colorOf(d.class_id);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = c;
      ctx.strokeRect(x, y, w, h);

      const text = d.label + ' ' + (d.conf * 100).toFixed(0) + '%';
      ctx.font = '600 12px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      const tw = ctx.measureText(text).width;
      const pad = 5, th = 19;
      let ty = y - th - 2;
      if (ty < 0) ty = y + 2;
      ctx.fillStyle = c;
      ctx.fillRect(x, ty, tw + pad * 2, th);
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + pad, ty + th / 2 + 0.5);
    });
  }

  function renderResult(data) {
    const dets = data.detections || [];
    lastDets = dets;
    result.style.display = 'block';
    $('empty').style.display = dets.length ? 'none' : 'block';
    $('dets').innerHTML = '';

    if (dets.length) {
      const counts = data.counts || {};
      $('sumMain').textContent = '检测到 ' + dets.length + ' 件器械';
      $('sumCounts').textContent = Object.entries(counts).map(([k, v]) => k + ' × ' + v).join(' · ');
      dets.forEach((d) => {
        const row = document.createElement('div');
        row.className = 'det';
        row.innerHTML = '<span class="dot" style="background:' + colorOf(d.class_id) + '"></span>' +
          '<span class="nm">' + d.label + '</span>' +
          '<span class="cf">' + (d.conf * 100).toFixed(1) + '%</span>';
        $('dets').appendChild(row);
      });
    } else {
      $('sumMain').textContent = '未检测到目标';
      $('sumCounts').textContent = '';
    }

    const ms = data.model_ms != null ? data.model_ms : data.infer_ms;
    $('foot').textContent = (data.backend || 'GPU 推理') + ' · 单张 ' + ms + ' ms' + footMetrics;
    drawBoxes(dets);
  }

  async function run() {
    if (!current || busy) return;
    busy = true; clearError();
    go.disabled = true;
    go.innerHTML = '<span class="spinner"></span>检测中…';

    const form = new FormData();
    form.append('file', current, current.name || 'paste.png');

    try {
      const resp = await fetch('api/predict', { method: 'POST', body: form });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        if (resp.status === 502 || resp.status === 504) throw new Error('推理实例暂时离线，请稍后重试');
        throw new Error(data.detail || ('请求失败（' + resp.status + '）'));
      }
      $('fdim').textContent = data.image.width + ' × ' + data.image.height;
      renderResult(data);
    } catch (e) {
      showError(e.message || '网络异常，请重试');
    } finally {
      busy = false;
      go.disabled = false;
      go.textContent = '重新检测';
    }
  }

  async function useSample(s) {
    const blob = await (await fetch(s.url)).blob();
    pick(new File([blob], s.name, { type: blob.type || 'image/jpeg' }));
    run();
  }

  drop.addEventListener('click', (e) => { if (e.target.tagName !== 'INPUT') fileInput.click(); });
  fileInput.addEventListener('change', () => pick(fileInput.files[0]));
  ['dragenter', 'dragover'].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) pick(f);
  });
  document.addEventListener('paste', (e) => {
    const items = (e.clipboardData || {}).items || [];
    for (const it of items) {
      if (it.type && it.type.indexOf('image') === 0) { pick(it.getAsFile()); break; }
    }
  });
  go.addEventListener('click', run);
  reset.addEventListener('click', resetAll);
  window.addEventListener('resize', () => { if (lastDets.length) drawBoxes(lastDets); });

  // 示例缩略图
  SAMPLES.forEach((s) => {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = s.url; img.alt = s.cap; img.title = '使用示例：' + s.cap;
    img.onclick = () => useSample(s);
    const cap = document.createElement('figcaption');
    cap.textContent = s.cap;
    fig.appendChild(img); fig.appendChild(cap);
    $('thumbs').appendChild(fig);
  });
  $('samples').style.display = 'block';

  // 类别与模型信息
  let footMetrics = '';
  fetch('api/health').then((r) => r.json()).then((h) => {
    if (h.names && h.names.length) {
      const box = $('classes');
      h.names.forEach((n, i) => {
        const c = document.createElement('span');
        c.className = 'chip';
        c.innerHTML = '<i style="background:' + colorOf(i) + '"></i>' + n;
        box.appendChild(c);
      });
      const total = document.createElement('span');
      total.className = 'chip';
      total.style.background = '#e8f5ee';
      total.style.color = '#0d6b38';
      total.textContent = '共 ' + h.classes + ' 类';
      box.appendChild(total);
    }
    if (h.metrics && h.metrics.map50) footMetrics = ' · mAP50 ' + (h.metrics.map50 * 100).toFixed(1) + '%';
    $('foot').textContent = (h.backend || 'GPU 推理') + ' · 可检测 ' + h.classes + ' 类器械' + footMetrics;
  }).catch(() => { $('foot').textContent = '推理实例离线'; });

  // ?demo=1 自动演示（点第三张示例：三件同框）
  if (new URLSearchParams(location.search).get('demo') === '1') {
    setTimeout(() => useSample(SAMPLES[3]), 150);
  }
})();
</script>
</body>
</html>
